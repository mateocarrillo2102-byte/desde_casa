<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Registro - Domicilios Maicao</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <nav class="nav-pruebas">
        <a href="../index.html">Catálogo e Interfaz de Compra</a> | 
        <a href="registro.html">Módulo Registro</a>
    </nav>

    <div class="contenedor">
        <h2>Módulo de Registro de Clientes</h2>
        <p>Pruebe el almacenamiento dinámico directamente en la base de datos <strong>desde_casa</strong>.</p>
        
        <form id="formRegistro">
            <div class="grupo-formulario">
                <label>Nombre Completo:</label>
                <input type="text" id="regNombre" required placeholder="Ej. Mateo Carrillo">
            </div>
            <div class="grupo-formulario">
                <label>Teléfono de Contacto:</label>
                <input type="text" id="regTelefono" required placeholder="Ej. 3001234567">
            </div>
            <div class="grupo-formulario">
                <label>Correo Electrónico:</label>
                <input type="email" id="regEmail" required placeholder="correo@ejemplo.com">
            </div>
            <div class="grupo-formulario">
                <label>Contraseña de Acceso:</label>
                <input type="password" id="regContrasena" required placeholder="••••••••">
            </div>
            <div class="grupo-formulario">
                <label>Método de Pago Preferido:</label>
                <select id="regmetodoPago">
                    <option value="Efectivo">Efectivo</option>
                    <option value="Nequi">Nequi</option>
                    <option value="Daviplata">Daviplata</option>
                </select>
            </div>
            
            <button type="submit" class="btn">Registrar Usuario en MySQL</button>
        </form>

        <h3>Respuesta de Node.js:</h3>
        <div id="resultadoRegistro" class="json-alerta">Esperando acción...</div>
    </div>

    <script>
        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            try {
                // CORRECCIÓN 1: Estructuramos el payload apuntando a los IDs correctos del HTML
                const payload = {
                    nombre: document.getElementById('regNombre').value,
                    telefono: document.getElementById('regTelefono').value,
                    email: document.getElementById('regEmail').value,
                    contrasena: document.getElementById('regContrasena').value,
                    // Corregido: Ahora apunta a 'regmetodoPago' que es el ID real del <select>
                    metodo_pago: document.getElementById('regmetodoPago').value 
                };

                // Imprimimos en la consola del navegador para certificar que el HTML empaquetó todo bien
                console.log("📤 Enviando datos desde el formulario:", payload);
                
                // CORRECCIÓN 2: Añadimos la dirección absoluta con el puerto 5000
                const respuesta = await fetch('http://localhost:5000/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await respuesta.json();
                
                // Mostrar la respuesta estética en el recuadro asignado
                document.getElementById('resultadoRegistro').innerText = JSON.stringify(data, null, 2);
                
                // Si el registro es exitoso, limpiar el formulario para una nueva prueba
                if (respuesta.status === 201) {
                    document.getElementById('formRegistro').reset();
                }

            } catch (error) {
                console.error("❌ Error en el flujo del Frontend:", error);
                document.getElementById('resultadoRegistro').innerText = "Error en el formulario: " + error.message;
            }
        });
    </script>
</body>
</html>
