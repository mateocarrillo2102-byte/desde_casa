<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DomiClick - Maicao</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-card">
        <div class="logo-container">
            <img src="logo.jpeg" alt="DomiClick" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">Domi<span>Click</span></div>
            <div class="slogan">★ RÁPIDO, SEGURO Y CERCA DE TI ★</div>
        </div>
        
        <h2>Bienvenido a Maicao</h2>
        
        <input type="email" id="email" placeholder="📧 Correo electrónico" autocomplete="off">
        <input type="password" id="password" placeholder="🔒 Contraseña">
        
        <button onclick="login()">Ingresar</button>
        
        <div id="errorMsg" class="error"></div>
        
        <div class="register-link">
            ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
        </div>
    </div>

    <script>
        async function login() {
            const email = document.getElementById('email').value;
            const contrasena = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            
            if (!email || !contrasena) {
                errorDiv.innerText = '❌ Por favor complete todos los campos';
                return;
            }
            
            errorDiv.innerText = '🔄 Validando credenciales...';
            
            try {
                const response = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, contrasena })
                });
                
                const data = await response.json();
                console.log("Respuesta:", data);
                
                if (!response.ok) {
                    throw new Error(data.error || 'Credenciales incorrectas');
                }
                
                // Guardar según el rol
                if (data.rol === 'Empresa') {
                    localStorage.setItem('id_empresa', data.id_empresa || data.id);
                    localStorage.setItem('id_usuario', data.id_usuario || data.id);
                    localStorage.setItem('rol', data.rol);
                    localStorage.setItem('nombre', data.nombre);
                    window.location.replace('login_empresa.html');
                } 
                else if (data.rol === 'Cliente') {
                    localStorage.setItem('id_usuario', data.id);
                    localStorage.setItem('rol', data.rol);
                    localStorage.setItem('nombre', data.nombre);
                    localStorage.setItem('email', email);
                    window.location.replace('login_cliente.html');
                }
                else if (data.rol === 'Domiciliario') {
                    localStorage.setItem('id_domiciliario', data.id);
                    localStorage.setItem('rol', data.rol);
                    localStorage.setItem('nombre', data.nombre);
                    window.location.replace('login_repartidor.html');
                }
                
            } catch (error) {
                errorDiv.innerText = `❌ ${error.message}`;
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
