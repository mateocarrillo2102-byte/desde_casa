<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema - Desde Casa</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <div class="contenedor">
        <h2>Inicio de Sesión Unificado</h2>
        <form id="formLogin">
            <div class="grupo-formulario">
                <label>Correo Electrónico:</label>
                <input type="email" id="logEmail" required placeholder="correo@ejemplo.com">
            </div>
            <div class="grupo-formulario">
                <label>Contraseña:</label>
                <input type="password" id="logContrasena" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Ingresar al Sistema</button>
        </form>
        <div id="alertaLogin" class="json-alerta" style="margin-top: 15px; padding: 10px; border-radius: 6px; text-align: center; background: #2a2d4a; color: #b5aeff;">Esperando credenciales...</div>
    </div>

    <script>
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evitar que la página se recargue

            const alerta = document.getElementById('alertaLogin');
            alerta.style.color = "#b5aeff";
            alerta.innerText = "Verificando credenciales en el sistema...";

            const payload = {
                email: document.getElementById('logEmail').value,
                contrasena: document.getElementById('logContrasena').value
            };

            try {
                // Petición formal al endpoint unificado de login en el puerto 5000
                const respuesta = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Leemos como texto primero para control de errores de red
                const textoPlano = await respuesta.text();
                console.log("Respuesta cruda del servidor:", textoPlano);
                
                const data = JSON.parse(textoPlano);

                if (respuesta.ok) {
                    alerta.style.color = "#28a745";
                    alerta.innerText = "¡Autenticación exitosa! Redirigiendo...";

                    // CORRECCIÓN CRÍTICA: Se unifica el uso de 'data' en lugar de 'datos'
                    localStorage.clear(); // Limpia cualquier rastro corrupto anterior
                    
                    localStorage.setItem('id_usuario', data.id);
                    localStorage.setItem('nombre_usuario', data.nombre);
                    localStorage.setItem('rol_usuario', data.rol);
                    
                    console.log("Sesión iniciada correctamente para: ", data.nombre);

                    // Redirección condicionada según el rol que devuelve el servidor
                    if (data.rol === 'Empresa') {
                        window.location.href = 'login_empresa.html';
                    } else {
                        window.location.href = 'login_cliente.html'; 
                    }
                    
                } else {
                    alerta.style.color = "#ff754c";
                    alerta.innerText = data.error || "Credenciales incorrectas";
                }

            } catch (error) {
                alerta.style.color = "#ff754c";
                alerta.innerText = "Error crítico: El servidor de Node.js no responde.";
                console.error("Detalle del error de comunicación:", error);
            }
        });
    </script>
</body>
</html>
