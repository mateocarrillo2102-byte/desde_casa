<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Inventario - DomiClick</title>
    <link rel="stylesheet" href="css/gestion_productos.css">
</head>
<body>
    <div class="container">
        <div class="navigation-header">
            <div>
                <h1>📦 Catálogo de Productos</h1>
                <p style="margin: 4px 0 0 0; color: var(--text-muted);" id="lblNombreEmpresa">Identificando sucursal...</p>
            </div>
            <div class="action-buttons">
                <a href="login_empresa.html" class="btn-nav btn-secondary">⬅ Volver al Dashboard</a>
                <a href="reg_producto.html" class="btn-nav btn-purple">➕ Agregar Nuevo Producto</a>
            </div>
        </div>

        <div class="filter-bar">
            <input type="text" id="txtBusqueda" class="search-input" placeholder="Buscar por nombre del artículo..." oninput="cargarProductos()">
            <select id="selectDisponibilidad" class="filter-select" onchange="cargarProductos()">
                <option value="todos">🔍 Mostrar todos</option>
                <option value="disponibles">🟢 Disponibles (con stock)</option>
                <option value="agotados">🔴 Agotados (sin stock)</option>
            </select>
        </div>

        <div class="products-grid" id="contenedorProductos"></div>
    </div>

    <!-- Modal de edición -->
    <div id="modalEdicion" class="modal">
        <div class="modal-content">
            <h3>✏️ Editar Producto</h3>
            <input type="text" id="editNombre" placeholder="Nombre del producto">
            <input type="number" id="editPrecio" placeholder="Precio" step="1000">
            <input type="number" id="editStock" placeholder="Stock">
            <div class="modal-buttons">
                <button class="btn-save" onclick="guardarEdicion()">💾 Guardar</button>
                <button class="btn-cancel" onclick="cerrarModal()">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        let tipoEmpresa = "";
        let productoEditando = null;

        window.onload = async function() {
            const idEmpresa = localStorage.getItem('id_empresa');
            if (!idEmpresa || idEmpresa === 'null') {
                mostrarToast("⚠️ No se encontró sesión de empresa", true);
                setTimeout(() => window.location.replace('login.html'), 2000);
                return;
            }
            
            try {
                const resEmpresa = await fetch(`http://localhost:5000/api/empresas/${idEmpresa}/analitica-avanzada`);
                if (resEmpresa.ok) {
                    const datos = await resEmpresa.json();
                    tipoEmpresa = datos.tipo ? datos.tipo.toLowerCase() : "";
                    document.getElementById('lblNombreEmpresa').innerText = `Inventario activo de: ${datos.nombre}`;
                }
            } catch (err) {
                console.error("Error:", err);
            }
            
            cargarProductos();
        };

        async function cargarProductos() {
            const idEmpresa = localStorage.getItem('id_empresa');
            const terminoBusqueda = encodeURIComponent(document.getElementById('txtBusqueda').value);
            const filtroDisponibilidad = document.getElementById('selectDisponibilidad').value;
            const contenedor = document.getElementById('contenedorProductos');

            try {
                const respuesta = await fetch(`http://localhost:5000/api/empresas/${idEmpresa}/productos?buscar=${terminoBusqueda}`);
                if (!respuesta.ok) throw new Error("Error en el servidor");
                
                let productos = await respuesta.json();

                if (filtroDisponibilidad === "disponibles") {
                    productos = productos.filter(p => p.stock > 0);
                } else if (filtroDisponibilidad === "agotados") {
                    productos = productos.filter(p => p.stock <= 0);
                }

                contenedor.innerHTML = "";

                if (productos.length === 0) {
                    contenedor.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No hay productos registrados con esos criterios.</p>`;
                    return;
                }

                const esRestaurante = (tipoEmpresa === "restaurante" || tipoEmpresa === "comida");
                
                productos.forEach(prod => {
                    const tieneStock = prod.stock > 0;
                    const stockTexto = esRestaurante ? "🟢 Ilimitado (se prepara al momento)" : (tieneStock ? `📦 Stock: ${prod.stock} uds` : "❌ Agotado");
                    const stockClass = tieneStock || esRestaurante ? "stock-disponible" : "stock-agotado";
                    const icono = esRestaurante ? "🍔" : "📦";

                    contenedor.innerHTML += `
                        <div class="product-card">
                            <div class="product-icon">${icono}</div>
                            <h3 class="product-title">${escapeHtml(prod.nombre)}</h3>
                            <div class="product-price">$${parseFloat(prod.precio).toLocaleString('es-CO')}</div>
                            <span class="stock-badge ${stockClass}">${stockTexto}</span>
                            <div class="product-actions">
                                <button class="btn-edit" onclick="abrirModalEditar(${prod.id_producto}, '${escapeHtml(prod.nombre)}', ${prod.precio}, ${prod.stock})">✏️ Editar</button>
                                <button class="btn-toggle-stock ${!tieneStock ? 'agotado' : ''}" onclick="toggleStock(${prod.id_producto}, ${prod.stock})">${tieneStock ? '🔴 Marcar Agotado' : '🟢 Marcar Disponible'}</button>
                                <button class="btn-delete" onclick="eliminarProducto(${prod.id_producto})">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("Error:", error);
                contenedor.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #D9643A; padding: 20px;">⚠️ Error de comunicación con el servidor.</p>`;
            }
        }

        function abrirModalEditar(id, nombre, precio, stock) {
            productoEditando = id;
            document.getElementById('editNombre').value = nombre;
            document.getElementById('editPrecio').value = precio;
            document.getElementById('editStock').value = stock;
            document.getElementById('modalEdicion').style.display = 'flex';
        }

        async function guardarEdicion() {
            const nuevoNombre = document.getElementById('editNombre').value;
            const nuevoPrecio = parseFloat(document.getElementById('editPrecio').value);
            const nuevoStock = parseInt(document.getElementById('editStock').value);
            
            try {
                const response = await fetch(`http://localhost:5000/api/productos/${productoEditando}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre: nuevoNombre,
                        precio: nuevoPrecio,
                        stock: nuevoStock
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    mostrarToast("✅ Producto actualizado correctamente");
                    cerrarModal();
                    cargarProductos();
                } else {
                    mostrarToast("❌ Error: " + data.error, true);
                }
            } catch (error) {
                mostrarToast("❌ Error de conexión", true);
            }
        }

        async function toggleStock(idProducto, stockActual) {
            const nuevoStock = stockActual > 0 ? 0 : 9999;
            const accion = stockActual > 0 ? "agotado" : "disponible";
            
            try {
                const response = await fetch(`http://localhost:5000/api/productos/${idProducto}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ stock: nuevoStock })
                });
                
                if (response.ok) {
                    mostrarToast(stockActual > 0 ? "🔴 Producto marcado como agotado" : "🟢 Producto marcado como disponible");
                    cargarProductos();
                } else {
                    mostrarToast("❌ Error al actualizar stock", true);
                }
            } catch (error) {
                mostrarToast("❌ Error de conexión", true);
            }
        }

        async function eliminarProducto(idProducto) {
            if (!confirm("¿Estás seguro de eliminar este producto?")) return;
            
            try {
                const response = await fetch(`http://localhost:5000/api/productos/${idProducto}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    mostrarToast("🗑️ Producto eliminado correctamente");
                    cargarProductos();
                } else {
                    mostrarToast("❌ Error al eliminar producto", true);
                }
            } catch (error) {
                mostrarToast("❌ Error de conexión", true);
            }
        }

        function cerrarModal() {
            document.getElementById('modalEdicion').style.display = 'none';
            productoEditando = null;
        }

        function mostrarToast(mensaje, esError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${esError ? 'error' : ''}`;
            toast.innerText = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
