<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - DomiClick</title>
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        .contenedor { max-width: 600px; margin: auto; padding: 20px; font-family: sans-serif; }
        .grupo-formulario { margin-bottom: 15px; }
        .grupo-formulario label { display: block; margin-bottom: 5px; font-weight: bold; }
        .grupo-formulario input { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; box-sizing: border-box; }
        .btn { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        .alerta-info { background-color: #e8f4fd; color: #1d82dc; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <nav class="nav-pruebas" style="padding: 10px; background: #eee; margin-bottom: 20px;">
        <a href="index.html">🏠 Inicio</a> | 
        <a href="gestion_productos.html">📦 Gestionar Inventario</a>
    </nav>

    <div class="contenedor">
        <h2>🛠️ Panel Admin: Carga de Inventario</h2>
        
        <p>Añada nuevos artículos al catálogo comercial de: <strong id="nombreEmpresaDinamico" style="color: #2c3e50;">Cargando datos corporativos...</strong></p>
        
        <div id="notificacionTipo" class="alerta-info" style="display: none;"></div>

        <form id="formProducto">
            <div class="grupo-formulario">
                <label>Nombre del Producto / Platillo:</label>
                <input type="text" id="prodNombre" required placeholder="Ej. Pizza Familiar Mixta">
            </div>
            
            <div class="grupo-formulario">
                <label>Precio de Venta ($ COP):</label>
                <input type="number" id="prodPrecio" required placeholder="Ej. 25000" min="0">
            </div>
            
            <div class="grupo-formulario" id="contenedorStock">
                <label>Cantidad Inicial en Stock:</label>
                <input type="number" id="prodStock" placeholder="Ej. 15" min="0">
            </div>
            
            <button type="submit" class="btn" style="background-color: #2c3e50;">Publicar en Catálogo</button>
        </form>

        <h3>Estado de la Transacción:</h3>
        <div id="resultadoOperacion" style="margin-top: 10px; font-weight: bold;">Esperando nuevo artículo...</div>
    </div>
    
    <script>
        let idEmpresaActiva = 2; // Por defecto en pruebas usará la empresa 2
        let tipoEmpresa = "";

        window.onload = async function() {
            // Sincronización de pruebas locales
            if (!localStorage.getItem('id_empresa')) {
                localStorage.setItem('id_empresa', '2');
            }
            
            idEmpresaActiva = localStorage.getItem('id_empresa');
            
            // Consultar los datos reales de la empresa al Backend
            try {
                const respuesta = await fetch(`http://localhost:5000/api/empresas/${idEmpresaActiva}`);
                if (respuesta.ok) {
                    const empresa = await respuesta.json();
                    tipoEmpresa = empresa.tipo ? empresa.tipo.toLowerCase() : "";
                    
                    // Colocamos el NOMBRE REAL de la base de datos en la pantalla
                    document.getElementById('nombreEmpresaDinamico').innerText = `${empresa.nombre} (ID: ${idEmpresaActiva})`;
                    
                    // LÓGICA INTELIGENTE DE STOCK: Si es restaurante o comida, adaptamos la UX
                    if (tipoEmpresa === "restaurante" || tipoEmpresa === "comida") {
                        document.getElementById('contenedorStock').style.display = 'none'; // Se oculta el campo
                        document.getElementById('prodStock').required = false;
                        
                        const notif = document.getElementById('notificacionTipo');
                        notif.style.display = 'block';
                        notif.innerText = "🍔 Modo Restaurante Detectado: El stock se gestionará como ilimitado de forma automática.";
                    } else {
                        document.getElementById('prodStock').required = true;
                    }
                } else {
                    document.getElementById('nombreEmpresaDinamico').innerText = `Empresa Desconocida (ID: ${idEmpresaActiva})`;
                }
            } catch (error) {
                console.error("Error cargando perfil corporativo:", error);
                document.getElementById('nombreEmpresaDinamico').innerText = "Error al conectar con el servidor";
            }
        }

        document.getElementById('formProducto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultadoDiv = document.getElementById('resultadoOperacion');
            
            // Si es restaurante, el stock físico no importa, mandamos un número alto por defecto
            let stockFinal = document.getElementById('prodStock').value;
            if (tipoEmpresa === "restaurante" || tipoEmpresa === "comida") {
                stockFinal = 9999; 
            }

            const nuevoProducto = {
                id_empresa: parseInt(idEmpresaActiva), 
                nombre: document.getElementById('prodNombre').value,
                precio: document.getElementById('prodPrecio').value,
                stock: stockFinal
            };

            try {
                resultadoDiv.style.color = "#34495e";
                resultadoDiv.innerText = "Procesando registro...";

                const respuesta = await fetch('http://localhost:5000/api/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoProducto)
                });
                
                const data = await respuesta.json();
                
                if (respuesta.status === 201) {
                    resultadoDiv.style.color = "#27ae60";
                    resultadoDiv.innerText = `✅ Éxito: ${data.mensaje} (Insertado correctamente)`;
                    document.getElementById('formProducto').reset();
                } else {
                    resultadoDiv.style.color = "#c0392b";
                    resultadoDiv.innerText = `❌ Error: ${data.error}`;
                }
            } catch (error) {
                console.error("Error de red:", error);
                resultadoDiv.style.color = "#c0392b";
                resultadoDiv.innerText = "Error de conexión: " + error.message;
            }
        });
    </script>
</body>
</html>
