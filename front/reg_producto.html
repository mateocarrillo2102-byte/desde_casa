<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Producto - DomiClick</title>
    <link rel="stylesheet" href="css/registro_prod.css">
</head>
<body>
    <div class="contenedor">
        <h2>🛠️ Agregar Nuevo Producto</h2>
        
        <p><strong id="nombreEmpresaDinamico">Cargando datos...</strong></p>
        
        <div id="notificacionTipo" class="alerta-info" style="display: none;"></div>

        <form id="formProducto">
            <div class="grupo-formulario">
                <label>📛 Nombre del Producto:</label>
                <input type="text" id="prodNombre" required placeholder="Ej. Pizza Familiar Mixta">
            </div>
            
            <div class="grupo-formulario">
                <label>💰 Precio de Venta ($ COP):</label>
                <input type="number" id="prodPrecio" required placeholder="Ej. 25000" min="0" step="1000">
            </div>
            
            <div class="grupo-formulario" id="contenedorStock">
                <label>📦 Cantidad Inicial en Stock:</label>
                <input type="number" id="prodStock" placeholder="Ej. 15" min="0" value="10">
            </div>
            
            <button type="submit" class="btn">📌 Publicar en Catálogo</button>
            
            <div class="botones-accion">
                <a href="gestion_productos.html" style="width: 100%;">
                    <button type="button" class="btn btn-secondary">📋 Ver Inventario</button>
                </a>
                <a href="login_empresa.html" style="width: 100%;">
                    <button type="button" class="btn btn-secondary">⬅ Volver al Dashboard</button>
                </a>
            </div>
        </form>

        <div id="resultadoOperacion" class="resultado">Esperando nuevo artículo...</div>
    </div>
    
    <script>
        let idEmpresaActiva = null;
        let tipoEmpresa = "";

        window.onload = async function() {
            idEmpresaActiva = localStorage.getItem('id_empresa');
            
            if (!idEmpresaActiva) {
                document.getElementById('nombreEmpresaDinamico').innerText = "❌ No se encontró sesión de empresa";
                return;
            }
            
            try {
                const respuesta = await fetch(`http://localhost:5000/api/empresas/${idEmpresaActiva}/analitica-avanzada`);
                if (respuesta.ok) {
                    const empresa = await respuesta.json();
                    tipoEmpresa = empresa.tipo ? empresa.tipo.toLowerCase() : "";
                    
                    document.getElementById('nombreEmpresaDinamico').innerHTML = `🏪 ${empresa.nombre}`;
                    
                    if (tipoEmpresa === "restaurante" || tipoEmpresa === "comida") {
                        document.getElementById('contenedorStock').style.display = 'none';
                        document.getElementById('prodStock').required = false;
                        
                        const notif = document.getElementById('notificacionTipo');
                        notif.style.display = 'block';
                        notif.innerHTML = "🍔 Modo Restaurante: El stock es ILIMITADO (se prepara al momento). Puedes gestionar disponibilidad desde el panel de inventario.";
                    } else {
                        document.getElementById('prodStock').required = true;
                    }
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('nombreEmpresaDinamico').innerText = "Error al conectar con el servidor";
            }
        };

        document.getElementById('formProducto').addEventListener('submit', async (e) => {
            e.preventDefault();
            const resultadoDiv = document.getElementById('resultadoOperacion');
            
            let stockFinal = document.getElementById('prodStock').value;
            if (tipoEmpresa === "restaurante" || tipoEmpresa === "comida") {
                stockFinal = 9999;
            }

            const nuevoProducto = {
                id_empresa: parseInt(idEmpresaActiva), 
                nombre: document.getElementById('prodNombre').value,
                precio: document.getElementById('prodPrecio').value,
                stock: parseInt(stockFinal)
            };

            try {
                resultadoDiv.className = "resultado";
                resultadoDiv.innerText = "🔄 Procesando registro...";

                const respuesta = await fetch('http://localhost:5000/api/productos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoProducto)
                });
                
                const data = await respuesta.json();
                
                if (respuesta.status === 201) {
                    resultadoDiv.className = "resultado exito";
                    resultadoDiv.innerText = `✅ ${data.mensaje}`;
                    document.getElementById('formProducto').reset();
                    
                    setTimeout(() => {
                        window.location.href = 'gestion_productos.html';
                    }, 1500);
                } else {
                    resultadoDiv.className = "resultado error";
                    resultadoDiv.innerText = `❌ Error: ${data.error}`;
                }
            } catch (error) {
                resultadoDiv.className = "resultado error";
                resultadoDiv.innerText = "❌ Error de conexión con el servidor";
                console.error(error);
            }
        });
    </script>
</body>
</html>
