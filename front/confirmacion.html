<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado — DomiClick</title>
    <link rel="stylesheet" href="css/confirmacion.css">
</head>
<body>

    <div class="tarjeta">
        <span class="icono-exito">🎉</span>
        <h1>¡Pedido enviado!</h1>
        <p>Estamos preparando tu orden. En breve un repartidor será asignado.</p>

        <div class="total-display" id="totalDisplay">Total: $0</div>

        <div class="acciones">
            <a href="login_cliente.html" class="btn btn-exito">🛒 Hacer otro pedido</a>
            
            <a href="estado-pedido.html" class="btn btn-alerta">🛵 Ver estado del pedido</a>
            
            <a href="login_cliente.html?vista=pedidos" class="btn btn-secundario">📜 Ver historial de pedidos</a>
        </div>

        <p class="estado-envio">Recibirás tu pedido en la dirección registrada.</p>
        <p id="mensajeError"></p>
    </div>

    <script>
    // ─── SEGURIDAD: CONTROL DE SESIÓN ───────────────────────
    const idUsuario = localStorage.getItem('id_usuario');
    if (!idUsuario) {
        alert('Debes iniciar sesión para continuar.');
        window.location.href = 'login.html';
    }

    async function enviarPedido() {
        const productos   = JSON.parse(localStorage.getItem('pedidoFinal') || '[]');
        const idEmpresa   = localStorage.getItem('id_empresa');
        const metodoPago  = localStorage.getItem('metodoPagoFinal') || 'Efectivo';
        const msgError    = document.getElementById('mensajeError');

        // Validación exhaustiva previa al envío
        if (!idUsuario || !idEmpresa || productos.length === 0) {
            msgError.innerText = 'Faltan datos críticos del pedido (Usuario, Empresa o Carrito vacío). Vuelva al catálogo.';
            msgError.style.display = 'block';
            return;
        }

        // BIEN FORMATEADO: Limpiamos los precios de signos de pesos, puntos o comas
        const productosFormateados = productos.map(item => {
            // Si el precio viene como string con "$", "." o "," lo limpiamos a número puro
            let precioLimpio = String(item.precio).replace(/[^0-9.-]/g, ""); 
            return {
                id_producto : parseInt(item.id_producto),
                cantidad    : parseInt(item.cantidad || 1),
                precio      : parseFloat(precioLimpio)
            };
        });

        console.log("🚀 Enviando Payload limpio al Backend:", {
            id_usuario  : parseInt(idUsuario),
            id_empresa  : parseInt(idEmpresa),
            metodo_pago : metodoPago,
            productos   : productosFormateados
        });

        try {
            const respuesta = await fetch('http://localhost:5000/api/pedidos', {
                method  : 'POST',
                headers : { 'Content-Type': 'application/json' },
                body    : JSON.stringify({
                    id_usuario  : parseInt(idUsuario),
                    id_empresa  : parseInt(idEmpresa),
                    metodo_pago : metodoPago,
                    productos   : productosFormateados
                })
            });

            const data = await respuesta.json();
            console.log("📥 Respuesta del Servidor Node:", data);

            if (respuesta.ok && data.id_pedido) {
                // Guardar el ID definitivo generado por MySQL para el rastreador
                localStorage.setItem('ultimo_id_pedido', data.id_pedido);
                
                // Actualizar la interfaz de éxito
                document.getElementById('totalDisplay').innerText = 
                    'Total Facturado: $' + parseFloat(data.total).toLocaleString('es-CO');
                
                // LIMPIEZA CONTROLADA: Borramos el carrito para evitar duplicados
                localStorage.removeItem('pedidoFinal');
                localStorage.removeItem('totalFinal');
                msgError.style.display = 'none';
            } else {
                msgError.innerText = 'Error en SQL: ' + (data.error || 'Verifique restricciones de llaves foráneas.');
                msgError.style.display = 'block';
            }
        } catch (err) {
            console.error('Error de red detectado:', err);
            msgError.innerText = 'Error crítico: No hay conexión con el servidor de Node.js.';
            msgError.style.display = 'block';
        }
    }

    // Ejecutar el procedimiento inmediatamente al cargar la vista
    document.addEventListener("DOMContentLoaded", enviarPedido);
</script>

</body>
</html>
