<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Confirmado — DomiClick</title>
    <link rel="stylesheet" href="css/confirmacion.css">
</head>
<body>

    <div class="tarjeta">
        <span class="icono-exito">🎉</span>
        <h1>¡Pedido enviado!</h1>
        <p>Estamos preparando tu orden. En breve un repartidor será asignado.</p>

        <div class="total-display" id="totalDisplay">Total: $0</div>

        <div class="acciones">
            <a href="panel-cliente.html" class="btn btn-exito">🛒 Hacer otro pedido</a>
            <a href="estado-pedido.html" class="btn btn-alerta">🛵 Ver estado del pedido</a>
            <a href="historial.html"     class="btn btn-secundario">📜 Ver historial de pedidos</a>
        </div>

        <p class="estado-envio">Recibirás tu pedido en la dirección registrada.</p>
        <p id="mensajeError"></p>
    </div>

    <script>
        // ─── Seguridad: redirigir si no hay sesión ───────────────────────
        const idUsuario = localStorage.getItem('id_usuario');
        if (!idUsuario) {
            alert('Debes iniciar sesión para continuar.');
            window.location.href = 'login.html';
        }

        // ─── Mostrar el total guardado en localStorage ───────────────────
        const totalGuardado = localStorage.getItem('totalFinal') || '$0';
        document.getElementById('totalDisplay').innerText = 'Total: ' + totalGuardado;

        // ─── Enviar el pedido al backend (puerto 5000) ───────────────────
        async function enviarPedido() {
            const productos   = JSON.parse(localStorage.getItem('pedidoFinal') || '[]');
            const idEmpresa   = localStorage.getItem('id_empresa');
            const metodoPago  = localStorage.getItem('metodoPagoFinal') || 'Efectivo';

            // Validaciones mínimas antes de llamar al API
            if (!idUsuario || !idEmpresa || productos.length === 0) {
                const msgError = document.getElementById('mensajeError');
                msgError.innerText = 'Faltan datos del pedido. Por favor vuelve al panel.';
                msgError.style.display = 'block';
                return;
            }

            // Mapear al formato que espera POST /api/pedidos
            const productosFormateados = productos.map(item => ({
                id_producto : item.id,
                cantidad    : item.cantidad || 1,
                precio      : item.precio
            }));

            try {
                const respuesta = await fetch('http://localhost:5000/api/pedidos', {
                    method  : 'POST',
                    headers : { 'Content-Type': 'application/json' },
                    body    : JSON.stringify({
                        id_usuario  : idUsuario,
                        id_empresa  : idEmpresa,
                        metodo_pago : metodoPago,
                        productos   : productosFormateados
                    })
                });

                const data = await respuesta.json();

                if (respuesta.ok) {
                    // Guardar el id del pedido para la página de estado
                    localStorage.setItem('ultimo_id_pedido', data.id_pedido);
                    // Actualizar el total con el valor real que devuelve el servidor
                    document.getElementById('totalDisplay').innerText =
                        'Total: $' + data.total;
                    // Limpiar carrito
                    localStorage.removeItem('pedidoFinal');
                    localStorage.removeItem('totalFinal');
                    localStorage.removeItem('metodoPagoFinal');
                } else {
                    const msgError = document.getElementById('mensajeError');
                    msgError.innerText = 'Error al registrar el pedido: ' + (data.error || 'Intenta de nuevo');
                    msgError.style.display = 'block';
                }
            } catch (err) {
                console.error('Error de red:', err);
                const msgError = document.getElementById('mensajeError');
                msgError.innerText = 'No se pudo conectar con el servidor.';
                msgError.style.display = 'block';
            }
        }

        enviarPedido();
    </script>

</body>
</html>
