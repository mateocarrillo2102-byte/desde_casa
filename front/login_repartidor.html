<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DomiClick - Dashboard Repartidor</title>
    <link rel="stylesheet" href="css/rep.css">
</head>
<body>
    <div class="navbar">
        <div class="logo-text">Domi<span>Click</span></div>
        <div class="nav-buttons">
            <a href="index.html" class="btn-home">🏠 Inicio</a>
            <div class="user-info">
                <span>🛵 <span id="userName">Repartidor</span></span>
                <button class="btn-logout" onclick="logout()">🚪 Salir</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="status-card">
            <div id="statusDisplay" class="status-disponible">🟢 Disponible</div>
            <button class="btn-toggle" id="toggleBtn" onclick="toggleEstado()">🔴 Marcar Ocupado</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="pendientes">📋 Pedidos Pendientes</button>
            <button class="tab-btn" data-tab="activos">🛵 Mis Entregas</button>
            <button class="tab-btn" data-tab="completados">✅ Historial</button>
        </div>

        <div id="tab-pendientes" class="tab-content active">
            <h2>📋 Pedidos Pendientes</h2>
            <div id="pendientesContainer">Cargando...</div>
        </div>

        <div id="tab-activos" class="tab-content">
            <h2>🛵 Mis Entregas</h2>
            <div id="activosContainer">Cargando...</div>
        </div>

        <div id="tab-completados" class="tab-content">
            <h2>✅ Historial de Pedidos</h2>
            <div id="completadosContainer">Cargando...</div>
        </div>
    </div>

    <script>
        let idDomiciliario = null;
        let estadoActual = 'Disponible';

        // Función para cambiar de pestaña
        function cambiarTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(`tab-${tabId}`).classList.add('active');
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-tab') === tabId) {
                    btn.classList.add('active');
                }
            });
        }

        // Configurar eventos de las pestañas
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tabId = btn.getAttribute('data-tab');
                cambiarTab(tabId);
            });
        });

        window.onload = async function() {
            idDomiciliario = localStorage.getItem('id_domiciliario');
            const nombre = localStorage.getItem('nombre');
            
            console.log("=== INICIANDO DASHBOARD REPARTIDOR ===");
            console.log("ID Repartidor:", idDomiciliario);
            
            if (!idDomiciliario) {
                alert("No hay sesión de repartidor");
                window.location.replace('login.html');
                return;
            }
            
            document.getElementById('userName').innerText = nombre || 'Repartidor';
            
            await cargarEstado();
            await cargarPendientes();
            await cargarActivos();
            await cargarHistorial();
            
            setInterval(async () => {
                await cargarPendientes();
                await cargarActivos();
            }, 10000);
        };
        
        async function cargarEstado() {
            try {
                const res = await fetch(`http://localhost:5000/api/domiciliarios/${idDomiciliario}/estado`);
                const data = await res.json();
                estadoActual = data.estado;
                
                const statusDiv = document.getElementById('statusDisplay');
                const toggleBtn = document.getElementById('toggleBtn');
                
                if (estadoActual === 'Disponible') {
                    statusDiv.className = 'status-disponible';
                    statusDiv.innerHTML = '🟢 Disponible';
                    toggleBtn.innerHTML = '🔴 Marcar Ocupado';
                } else {
                    statusDiv.className = 'status-ocupado';
                    statusDiv.innerHTML = '🔴 Ocupado';
                    toggleBtn.innerHTML = '🟢 Marcar Disponible';
                }
            } catch (error) {
                console.error("Error cargando estado:", error);
            }
        }
        
        async function toggleEstado() {
            const nuevoEstado = estadoActual === 'Disponible' ? 'Ocupado' : 'Disponible';
            try {
                const res = await fetch(`http://localhost:5000/api/domiciliarios/${idDomiciliario}/estado`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: nuevoEstado })
                });
                if (res.ok) {
                    estadoActual = nuevoEstado;
                    await cargarEstado();
                    await cargarPendientes();
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }
        
        function obtenerIconoProducto(nombre) {
            if (!nombre) return '📦';
            if (nombre.toLowerCase().includes('pizza')) return '🍕';
            if (nombre.toLowerCase().includes('hamburguesa')) return '🍔';
            if (nombre.toLowerCase().includes('acetaminofen') || nombre.toLowerCase().includes('dolex')) return '💊';
            if (nombre.toLowerCase().includes('coca') || nombre.toLowerCase().includes('gaseosa')) return '🥤';
            return '📦';
        }
        
        async function cargarPendientes() {
            const container = document.getElementById('pendientesContainer');
            container.innerHTML = '<div class="no-pedidos">🔄 Cargando pedidos pendientes...</div>';
            
            try {
                const res = await fetch('http://localhost:5000/api/pedidos/pendientes');
                const data = await res.json();
                console.log("Pendientes:", data);
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-pedidos">📭 No hay pedidos pendientes</div>';
                    return;
                }
                
                container.innerHTML = data.map(p => {
                    const icono = obtenerIconoProducto(p.producto_principal || `Pedido #${p.id_pedido}`);
                    const nombreMostrar = p.tiene_varios ? `${icono} ${p.producto_principal} + más` : `${icono} ${p.producto_principal || `Pedido #${p.id_pedido}`}`;
                    return `
                        <div class="pedido-card">
                            <div class="pedido-info">
                                <div class="pedido-nombre">${nombreMostrar}</div>
                                <div class="pedido-empresa">🏪 ${p.empresa_nombre || 'Empresa'}</div>
                                <div class="pedido-direccion">📍 ${p.direccion_entrega || 'Dirección no registrada'}</div>
                            </div>
                            <div class="pedido-precio">
                                $${(p.total || 0).toLocaleString()}
                            </div>
                            <div class="pedido-accion">
                                ${estadoActual === 'Disponible' ? 
                                    `<button class="btn-asignar" onclick="asignarPedido(${p.id_pedido})">🛵 Tomar Pedido</button>` : 
                                    '<button class="btn-ocupado" disabled>🔴 Ocupado</button>'}
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = '<div class="no-pedidos">❌ Error al cargar pedidos</div>';
            }
        }
        
        async function cargarActivos() {
            const container = document.getElementById('activosContainer');
            container.innerHTML = '<div class="no-pedidos">🔄 Cargando tus entregas...</div>';
            
            try {
                const res = await fetch(`http://localhost:5000/api/domiciliarios/${idDomiciliario}/pedidos-activos`);
                const data = await res.json();
                console.log("Activos:", data);
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-pedidos">📭 No tienes entregas activas</div>';
                    return;
                }
                
                container.innerHTML = data.map(p => {
                    return `
                        <div class="pedido-card">
                            <div class="pedido-info">
                                <div class="pedido-nombre">📦 Pedido #${p.id_pedido}</div>
                                <div class="pedido-empresa">🏪 ${p.empresa_nombre}</div>
                                <div class="pedido-cliente">👤 ${p.cliente_nombre || 'Cliente'}</div>
                                <div class="pedido-direccion">📍 ${p.cliente_direccion || 'Sin dirección'}</div>
                                <div class="pedido-estado">🚚 Estado: ${p.estado === 'Preparacion' ? '🍳 En preparación (esperando restaurante)' : '🛵 En camino'}</div>
                            </div>
                            <div class="pedido-precio">
                                $${(p.total || 0).toLocaleString()}
                            </div>
                            <div class="pedido-accion">
                                ${p.estado === 'En camino' ? 
                                    `<button class="btn-entregar" onclick="entregarPedido(${p.id_pedido})">✅ Marcar Entregado</button>` : 
                                    `<button class="btn-ocupado" disabled style="background:#F4A236;">⏳ Esperando confirmación del restaurante</button>`
                                }
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = '<div class="no-pedidos">❌ Error al cargar tus entregas</div>';
            }
        }
        
        async function cargarHistorial() {
            const container = document.getElementById('completadosContainer');
            container.innerHTML = '<div class="no-pedidos">🔄 Cargando historial...</div>';
            
            try {
                const res = await fetch(`http://localhost:5000/api/domiciliarios/${idDomiciliario}/historial`);
                const data = await res.json();
                console.log("Historial:", data);
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<div class="no-pedidos">📭 No hay pedidos completados</div>';
                    return;
                }
                
                container.innerHTML = data.map(p => {
                    return `
                        <div class="pedido-card historial">
                            <div class="pedido-info">
                                <div class="pedido-nombre">📦 Pedido #${p.id_pedido}</div>
                                <div class="pedido-empresa">🏪 ${p.empresa_nombre}</div>
                                <div class="pedido-fecha">📅 ${new Date(p.fecha).toLocaleDateString()}</div>
                            </div>
                            <div class="pedido-precio">
                                $${(p.total || 0).toLocaleString()}
                            </div>
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = '<div class="no-pedidos">❌ Error al cargar historial</div>';
            }
        }
        
        async function asignarPedido(idPedido) {
            try {
                const res = await fetch(`http://localhost:5000/api/pedidos/${idPedido}/asignar`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_domiciliario: idDomiciliario })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`✅ Pedido #${idPedido} asignado! El restaurante lo preparará.`);
                    await cargarPendientes();
                    await cargarActivos();
                    await cargarEstado();
                    cambiarTab('activos');
                } else {
                    alert(`❌ ${data.error}`);
                }
            } catch (error) {
                alert("❌ Error de conexión");
            }
        }
        
        async function entregarPedido(idPedido) {
            if (!confirm(`¿Confirmas que entregaste el pedido #${idPedido}?`)) return;
            try {
                const res = await fetch(`http://localhost:5000/api/pedidos/${idPedido}/entregar`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await res.json();
                if (res.ok) {
                    alert(`✅ Pedido #${idPedido} entregado! Gracias por tu trabajo.`);
                    await cargarActivos();
                    await cargarHistorial();
                    await cargarEstado();
                    await cargarPendientes();
                    cambiarTab('completados');
                } else {
                    alert(`❌ ${data.error}`);
                }
            } catch (error) {
                alert("❌ Error de conexión");
            }
        }
        
        function logout() {
            localStorage.clear();
            window.location.replace('index.html');
        }
    </script>
</body>
</html>
